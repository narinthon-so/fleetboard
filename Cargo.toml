[package]
name = "fleetboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
gethostname = "1.1.0"
getrandom = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
rust-embed = "8.5"
mime_guess = "2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tempfile = "3.27.0"

[lib]
name = "fleetboard"
path = "src/lib.rs"

[[bin]]
name = "fb"
path = "src/main.rs"
